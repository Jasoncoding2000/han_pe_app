<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 40px; background: #222; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; gap: 30px; }
  h2 { color: #ccc; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  .cell { width: 280px; height: 280px; display: flex; align-items: center; justify-content: center; border-radius: 24px; position: relative; }
  .cell img { width: 220px; height: 220px; }
  .cell .label { position: absolute; bottom: 8px; color: #aaa; font-size: 12px; }
  .dark { background: #000; }
  .light { background: #f0f0f0; }
  .blue { background: linear-gradient(135deg, #1a237e, #42a5f5); }
  .checker { background: repeating-conic-gradient(#888 0% 25%, #555 0% 50%) 50% / 20px 20px; }
</style>
</head>
<body>
  <h2>hanPE Icon — Transparent Background Preview</h2>
  <div class="grid">
    <div class="cell dark">
      <img src="app_icon.png" alt="icon" />
      <span class="label">Dark background</span>
    </div>
    <div class="cell light">
      <img src="app_icon.png" alt="icon" />
      <span class="label">Light background</span>
    </div>
    <div class="cell blue">
      <img src="app_icon.png" alt="icon" />
      <span class="label">Gradient background</span>
    </div>
    <div class="cell checker">
      <img src="app_icon.png" alt="icon" />
      <span class="label">Transparency check</span>
    </div>
  </div>
</body>
</html>
